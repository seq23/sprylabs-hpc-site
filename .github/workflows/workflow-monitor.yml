name: Workflow Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '47 15 * * *'

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run workflow:monitor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-monitor
          path: reports/workflow-monitor.json
