name: Daily Citation Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * *"

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  contents: read

concurrency:
  group: daily-citation-intelligence-main
  cancel-in-progress: false

jobs:
  daily-citation-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run shadow citation intelligence proof lane
        run: |
          npm run workflow:daily-citation-intelligence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spry-daily-citation-intelligence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/signals/**
            artifacts/validation/**
            reports/**
