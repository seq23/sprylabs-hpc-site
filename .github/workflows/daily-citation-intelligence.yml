name: Daily Citation Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * *"

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  contents: read

jobs:
  daily-citation-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npm run workflow:daily-citation-intelligence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-citation-intelligence-proof
          path: |
            artifacts/validation/fixture-signal-trace.json
            artifacts/validation/daily-citation-release-plan.json
            artifacts/validation/daily-proof-packet.json
            reports/fixture-signal-trace.md
            reports/daily-proof-packet.md
