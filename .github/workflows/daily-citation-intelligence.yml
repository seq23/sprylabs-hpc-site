name: Daily Citation Intelligence
on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        # Owner, 11 Oct 2026: "nothing should be paid". false (default) runs the
        # citation probe in knowledge mode on $0 models only (config/llm_routing.json).
        # true runs the grounded probe, which OpenRouter bills per request.
        description: "Run the PAID grounded citation probe (billed per call)"
        required: false
        type: boolean
        default: false
      pin_drip:
        # aplayermode.com Pinterest drip: run the weekly refill + metrics today
        # instead of waiting for Monday (scripts/aplayermode/weekly_pin_drip.sh).
        description: "Run the aplayermode.com Pinterest weekly refill + metrics now"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "37 13 * * *"
env:
  NODE_OPTIONS: --max-old-space-size=3072
  PUSH_RETRY_ATTEMPTS: 5
  GITHUB_TOKEN: ${{ github.token }}
permissions:
  contents: write
  # Lets the shared push helper request Validate Repo for the commit it just
  # landed. A GITHUB_TOKEN push raises no push event, so without this the
  # workflow can change main but nothing can be asked to check it.
  actions: write
concurrency:
  group: main-automation
  cancel-in-progress: false
jobs:
  daily-citation-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Read by the aplayermode.com Pinterest drip's metrics step, here at job level
    # so the push helper's replay (WORKFLOW_ARGV) measures too. Absent -> the named
    # stop PINTEREST_METRICS_UNAVAILABLE, never an unmeasured zero.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PIN_DRIP_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.pin_drip && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Sync latest main before install
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      # This lane's commit_and_push_if_changed.sh call below runs
      # converge_tree_before_commit.sh, which calls `npm run build:all`
      # (scripts/build/cached_build_all.sh) directly, one or more times, on
      # every run. Restoring whatever prior runs already cached here means a
      # pass whose input state repeats — the common case on a scheduled lane
      # that mostly touches signals, not generator inputs — is a near-instant
      # cache hit instead of a full ~2,231-page regeneration. A miss costs
      # nothing beyond the normal build; see docs/runbooks/BUILD_CACHE.md.
      - uses: actions/cache@v4
        with:
          path: .build-cache
          key: build-all-cache-v1-${{ github.run_id }}
          restore-keys: |
            build-all-cache-v1-
      - name: Check autonomous runtime state
        id: runtime
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const state = fs.existsSync('data/admin/runtime_control.json') ? JSON.parse(fs.readFileSync('data/admin/runtime_control.json','utf8')) : {};
          console.log(`run=${state.autopublishing === 'paused' || state.emergency_stop === true ? 'false' : 'true'}`);
          NODE
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run autonomous zero-dollar gap-filling lane
        if: steps.runtime.outputs.run == 'true'
        run: npm run workflow:zero-dollar-autonomous
      - name: aplayermode.com Pinterest drip (weekly refill + metrics, Mondays CT)
        # Owner-approved 16 Oct 2026. The daily release happens in the Worker at
        # request time; this keeps the dated queue stocked ($0 template copy) and
        # measures Pinterest-referred visits per pin. Named skip on other days.
        if: steps.runtime.outputs.run == 'true'
        run: bash scripts/aplayermode/weekly_pin_drip.sh
      - name: Identify the OpenRouter key (label and limits only, never the key)
        # Free-routing receipt: which key the repo secret is and what it may spend.
        # Prints only label, limit, usage, is_free_tier, limit_remaining.
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node --input-type=module -e "import { keyInfo } from './scripts/lib/free_llm_router.mjs'; console.log('[free-router] key_label ' + JSON.stringify(await keyInfo(process.env.OPENROUTER_API_KEY)));"
      - name: Observe whether answer engines cite us
        # The probe shipped in seven repos and was invoked by none of them, so no
        # citation observation was ever taken. Grounded mode reads the pages the
        # answer was actually built from; knowledge mode would only show whether
        # a model memorised the brand, which is not a citation.
        #
        # Off every schedule (owner, 11 Oct 2026: "nothing should be paid"). On a
        # dispatch it runs knowledge mode through the free router ($0 models only,
        # named stop when none answers or the key is refused). Grounded mode is
        # billed per request and runs only with confirm_paid: true; the script
        # refuses it otherwise (DISABLED_BY_OWNER_POLICY). Guard:
        # validate:zero-paid-llm. A non-zero reported cost fails this step.
        if: steps.runtime.outputs.run == 'true' && github.event_name == 'workflow_dispatch'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIRM_PAID: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_paid && 'true' || 'false' }}
          CITATION_PROBE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_paid && 'grounded' || 'knowledge' }}
        run: node scripts/llm_citation_probe.mjs --limit 25
      # This lane runs the absorber and commits what it writes, so it is the one
      # lane where derived output is actually produced. validate:ownership no
      # longer hash-pins derived files - it asserts they are reproducible, and
      # that assertion lives in the reproducibility validator below. Without it
      # here, the split would have removed protection from the exact lane that
      # writes the files: a guard that cannot reach what it governs.
      - name: Validate ownership, derived reproducibility and Safe Harbor
        if: steps.runtime.outputs.run == 'true'
        run: npm run validate:ownership && npm run validate:derived-absorber-reproducibility && npm run safe-harbor:validate
      - name: Commit validated changes
        if: steps.runtime.outputs.run == 'true'
        env:
          WORKFLOW_ARGV: >-
            npm run workflow:zero-dollar-autonomous &&
            bash scripts/aplayermode/weekly_pin_drip.sh &&
            node scripts/llm_citation_probe.mjs --limit 25 &&
            npm run validate:ownership &&
            npm run validate:derived-absorber-reproducibility &&
            npm run safe-harbor:validate
        run: |
          ./.github/scripts/commit_and_push_if_changed.sh "zero-dollar citation intelligence: autonomous gap fill" daily-citation-intelligence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spry-daily-citation-intelligence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/signals/**
            data/governance/**
            data/health/**
            data/metrics/**
            data/admin/**
            artifacts/validation/**
            reports/**
