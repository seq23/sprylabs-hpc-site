name: Spry Content Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: false
        default: full-content-cycle
        type: choice
        options:
          - full-content-cycle
          - agent-intake
          - daily-insight
          - signal-intake
          - synthesis
          - whitepaper
          - citation-expansion
          - strict
  schedule:
    - cron: "17 14 * * *"
  push:
    branches:
      - main
    paths:
      - "data/report_fixes/agent_runs/**/agent_run_manifest.json"

env:
  NODE_OPTIONS: --max-old-space-size=3072
  PUSH_RETRY_ATTEMPTS: 5
  REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
  REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before install
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve release mode
        run: |
          RELEASE_MODE="${{ github.event.inputs.mode }}"
          if [ -z "$RELEASE_MODE" ]; then RELEASE_MODE="full-content-cycle"; fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then RELEASE_MODE="agent-intake"; fi
          echo "RELEASE_MODE=$RELEASE_MODE" >> "$GITHUB_ENV"
      - name: Run governed Spry content release
        run: |
          npm run workflow:run -- --workflow spry-content-release -- npm run workflow:spry-content-release -- --mode "$RELEASE_MODE"
      - name: Commit validated Spry content release
        run: |
          ./.github/scripts/commit_and_push_if_changed.sh "spry content release" spry-content-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spry-content-release-trace-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/workflows/spry-content-release/**
            artifacts/validation/**
            reports/workflow-*.json
