name: Spry Content Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: false
        default: full-content-cycle
        type: choice
        options:
          - full-content-cycle
          - agent-intake
          - daily-insight
          - signal-intake
          - synthesis
          - whitepaper
          - citation-expansion
          - strict
  schedule:
    - cron: "17 14 * * *"
  push:
    branches:
      - main
    paths:
      - "data/report_fixes/agent_runs/**/agent_run_manifest.json"

env:
  NODE_OPTIONS: --max-old-space-size=3072
  PUSH_RETRY_ATTEMPTS: 5
  GITHUB_TOKEN: ${{ github.token }}
  REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
  REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

permissions:
  contents: write
  # Lets the shared push helper request Validate Repo for the commit it just
  # landed. A GITHUB_TOKEN push raises no push event, so without this the
  # workflow can change main but nothing can be asked to check it.
  actions: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'snapshot update from baseline ZIP') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main before install
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Check autonomous runtime state
        id: runtime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const state = fs.existsSync('data/admin/runtime_control.json') ? JSON.parse(fs.readFileSync('data/admin/runtime_control.json','utf8')) : {};
          console.log(`run=${state.autopublishing === 'paused' || state.emergency_stop === true ? 'false' : 'true'}`);
          NODE
          fi
      - uses: actions/setup-node@v7
        if: steps.runtime.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.runtime.outputs.run == 'true'
      # Converge the tree the release is about to commit (below) calls
      # `npm run build:all` (scripts/build/cached_build_all.sh) one or more
      # times through its loop, on every run. Restoring whatever prior runs
      # already cached here means a pass whose input state repeats is a
      # near-instant cache hit instead of a full ~2,231-page regeneration; a
      # miss costs nothing beyond the normal build. See
      # docs/runbooks/BUILD_CACHE.md.
      - uses: actions/cache@v4
        if: steps.runtime.outputs.run == 'true'
        with:
          path: .build-cache
          key: build-all-cache-v1-${{ github.run_id }}
          restore-keys: |
            build-all-cache-v1-
      # Reports whether adding volume is still being absorbed. Advisory: it refuses
      # to hold publishing on pre-2026-08-26 data, because that window measures a
      # site whose sitemaps were never submitted and whose unknown URLs returned 200.
      - name: Cadence headroom
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITES: ${{ secrets.GSC_SITE_URL_SPRY }},${{ secrets.GSC_SITE_URL_BHPC }}
        run: npm run cadence:headroom
        if: steps.runtime.outputs.run == 'true'
      - name: Resolve release mode
        if: steps.runtime.outputs.run == 'true'
        run: |
          RELEASE_MODE="${{ github.event.inputs.mode }}"
          if [ -z "$RELEASE_MODE" ]; then RELEASE_MODE="full-content-cycle"; fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then RELEASE_MODE="agent-intake"; fi
          echo "RELEASE_MODE=$RELEASE_MODE" >> "$GITHUB_ENV"
      - name: Run governed Spry content release
        if: steps.runtime.outputs.run == 'true'
        run: |
          npm run workflow:run -- --workflow spry-content-release -- npm run workflow:spry-content-release -- --mode "$RELEASE_MODE"
      - name: Rebuild ownership and admin snapshots
        if: steps.runtime.outputs.run == 'true'
        run: npm run ownership:build && npm run admin:build

      # CONVERGE BEFORE COMMITTING.
      #
      # This workflow used to commit straight after workflow:spry-content-release
      # + ownership:build + admin:build. None of those run build:all or the four
      # ordered repair stages that follow it, so the release published pages the
      # downstream generators had never seen. The tree it landed on main was not
      # the generators' fixed point: reproduced on 2d94a44ef, one build:all plus
      # the four repairs rewrote 1,640 governed extraction surfaces, and a second
      # pass rewrote 2 more before reaching a fixed point at the third.
      #
      # That is what turned main red on 2026-08-31. The extraction-surface guard
      # is the first thing in the profile that reads those surfaces, so it took
      # the blame for a tree that three earlier stages had left half-built. The
      # snapshot was not stale - it was correct, and the tree was wrong.
      #
      # The loop is bounded and self-proving rather than a fixed number of passes:
      # each iteration baselines the tree, runs the ordered stages, and asks the
      # guard whether they changed anything. A pass that changes nothing IS the
      # fixed point, and the snapshot left behind is the one that matches the tree
      # about to be committed. Falling out of the loop without converging fails
      # the release: publishing a tree the generators still disagree with is the
      # defect this step exists to stop, so it must never be the quiet outcome.
      # The convergence loop that used to be written out inline here now lives
      # in .github/scripts/converge_tree_before_commit.sh, because #46 fixed it
      # at this lane and the identical defect came straight back on 2026-09-01
      # through daily-citation-intelligence.yml, which has no such step. That
      # script is the single authority and commit_and_push_if_changed.sh calls
      # it for every main-writing lane.
      #
      # This lane still calls it explicitly, and must: the cadence gate and the
      # cadence-baseline accept step below both read the tree, and they have to
      # read the converged one rather than whatever the release stages left
      # behind. The call from the commit helper afterwards re-verifies the fixed
      # point and costs seconds when it is already reached.
      - name: Converge the tree the release is about to commit
        if: steps.runtime.outputs.run == 'true'
        run: bash .github/scripts/converge_tree_before_commit.sh spry-content-release
      # The gate runs before anything is committed, so a release that published
      # faster than the cap allows fails here and its pages never land.
      #
      # Guarded on the runtime state like every other working step. Without the
      # guard a PAUSED run - one that deliberately published nothing - still ran
      # the gate, and a gate that blocked turned a correct, deliberate no-publish
      # day into a red workflow with no bad release behind it. A throttled run
      # reports a named stop; it does not fail.
      - name: Cadence gate
        if: steps.runtime.outputs.run == 'true'
        run: npm run cadence:gate

      - name: Named stop when autopublishing is paused
        if: steps.runtime.outputs.run != 'true'
        run: |
          echo "spry-content-release STOP autopublishing_paused: data/admin/runtime_control.json has autopublishing=paused or emergency_stop=true, so this run published nothing and the cadence gate and ledger were deliberately not touched. Resume with the Admin Command workflow (resume_autopublishing)."

      # A read-only gate with no advancer is a ratchet. Nothing else in this
      # repository writes data/cadence/known_urls.json - checking deliberately
      # stopped writing it so the gate could not consume its own evidence - so if
      # the one workflow that publishes never records what it published, the
      # ledger freezes while the library grows and the count of "new" URLs climbs
      # every run until it crosses the cap and stays over it permanently, with no
      # bad release behind it.
      #
      # Reachable only after the gate above exited zero, so the cap still binds:
      # an over-cap release fails at that step and never reaches this one.
      - name: Record the released URL set as the new cadence baseline
        if: steps.runtime.outputs.run == 'true'
        run: |
          node scripts/cadence_gate.js --accept --reason "Spry content release run ${{ github.run_id }} on $(date -u +%F): the cadence gate cleared at the step before this one, so the URL set this run released was inside the cap in force at that moment. This records what was released; it is not a claim about any other window."

      - name: Commit validated Spry content release
        if: steps.runtime.outputs.run == 'true'
        env:
          WORKFLOW_ARGV: >-
            npm run workflow:run -- --workflow spry-content-release -- npm run workflow:spry-content-release -- --mode "$RELEASE_MODE" &&
            npm run ownership:build &&
            npm run admin:build &&
            npm run build:all &&
            npm run repair:dual-domain-metadata &&
            npm run agent:bhpc:apply-report-contract &&
            npm run release:repair-agent-normalization &&
            npm run repair:citation-contract-surfaces &&
            npm run sitemap:lastmod:content
        run: |
          ./.github/scripts/commit_and_push_if_changed.sh "spry content release" spry-content-release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spry-content-release-trace-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/workflows/spry-content-release/**
            artifacts/validation/**
            reports/workflow-*.json
