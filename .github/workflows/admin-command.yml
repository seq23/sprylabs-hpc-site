name: Admin Command
on:
  workflow_dispatch:
    inputs:
      action: {description: "Registered command", required: true, type: string}
      target_id: {description: "Optional target", required: false, type: string}
      reason: {description: "Optional reason", required: false, type: string}
env:
  NODE_OPTIONS: --max-old-space-size=3072
  PUSH_RETRY_ATTEMPTS: 5
  GITHUB_TOKEN: ${{ github.token }}
permissions:
  contents: write
  # Lets the shared push helper request Validate Repo for the commit it just
  # landed. A GITHUB_TOKEN push raises no push event, so without this the
  # workflow can change main but nothing can be asked to check it.
  actions: write
concurrency:
  group: main-automation
  cancel-in-progress: false
jobs:
  command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Sync latest main before install
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - name: Execute registered command
        env:
          ADMIN_ACTION: ${{ inputs.action }}
          ADMIN_TARGET: ${{ inputs.target_id }}
          ADMIN_REASON: ${{ inputs.reason }}
        run: node scripts/admin/run_admin_command.mjs
      - run: npm run admin:build && npm run validate:full-safe-autonomy
      - name: Commit control state
        env:
          ADMIN_ACTION: ${{ inputs.action }}
          ADMIN_TARGET: ${{ inputs.target_id }}
          ADMIN_REASON: ${{ inputs.reason }}
          WORKFLOW_ARGV: node scripts/admin/run_admin_command.mjs && npm run admin:build && npm run validate:full-safe-autonomy
        run: |
          ./.github/scripts/commit_and_push_if_changed.sh "admin command: ${ADMIN_ACTION}" admin-command
