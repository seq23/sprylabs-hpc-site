name: Postdeploy Public Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public base URL to audit"
        required: true
        default: "https://sprylabs-hpc-site.pages.dev"
        type: string
  workflow_run:
    workflows: ["Deploy Distribution"]
    types: [completed]
    branches: [main]

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  contents: read

concurrency:
  group: postdeploy-public-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Resolve public base URL
        id: target
        env:
          MANUAL_URL: ${{ inputs.base_url }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${MANUAL_URL:-}" ]; then
            echo "base_url=$MANUAL_URL" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://sprylabs-hpc-site.pages.dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Run deployed public route audit
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: npm run postdeploy:public-click-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spry-postdeploy-public-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/diagnostics/**
            test-results/**
            playwright-report/**
