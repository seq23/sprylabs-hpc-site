name: Citation Velocity 5K

on:
  workflow_dispatch:
  schedule:
    - cron: '12 13 * * *'

env:
  NODE_OPTIONS: --max-old-space-size=3072
  REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
  REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npm run workflow:run -- --workflow citation-velocity-5k -- npm run programmatic:run-lane -- --lane citation_velocity_batch -- npm run workflow:citation-velocity-5k
      - run: |
          ./.github/scripts/commit_and_push_if_changed.sh "auto: citation velocity 5k batch" citation-velocity-5k
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citation-velocity-5k-trace
          path: reports/workflows/citation-velocity-5k/
