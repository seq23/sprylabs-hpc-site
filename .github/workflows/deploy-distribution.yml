name: Deploy Distribution

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate"]
    types:
      - completed

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate and attest manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run release:ci-validate
      - name: Download validated distribution from Validate run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: validated-distribution
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Normalize downloaded validation artifact
        if: github.event_name == 'workflow_run'
        run: |
          mkdir -p .build
          if [ ! -f .build/validation-attestation.json ] && [ -f reports/validation-attestation.json ]; then
            cp reports/validation-attestation.json .build/validation-attestation.json
          fi
          test -f .build/validation-attestation.json
          test -f .build/indexnow-priority.txt
          test -f .build/indexnow-batch.txt
      - run: |
          npm run release:verify-attestation
      - run: |
          npm run distribution:deploy
