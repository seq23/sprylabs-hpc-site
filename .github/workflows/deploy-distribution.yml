name: Deploy Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-distribution:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_ENDPOINT: https://api.indexnow.org/indexnow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Prepare distribution artifacts
        run: npm run distribution:prepare

      - name: Validate IndexNow distribution workflow
        run: npm run validate:indexnow-workflow

      - name: Submit IndexNow or write dry-run report
        run: |
          if [ -n "${INDEXNOW_KEY:-}" ]; then
            npm run distribution:deploy -- --key "$INDEXNOW_KEY" --artifact-dir .build --allow-mixed
          else
            echo "INDEXNOW_KEY secret is missing; writing dry-run IndexNow report instead of silently skipping."
            INDEXNOW_DRY_RUN=1 npm run distribution:deploy -- --artifact-dir .build --allow-mixed
          fi

      - name: Upload distribution artifacts and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprylabs-hpc-distribution-reports
          path: |
            .build
            reports/indexnow-submit-report.json
