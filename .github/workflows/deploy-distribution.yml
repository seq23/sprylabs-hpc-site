name: Deploy Distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-distribution:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_ENDPOINT: https://api.indexnow.org/indexnow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:all
      - run: npm run validate:distribution
      - name: Submit IndexNow or write dry-run report
        run: |
          if [ -n "${INDEXNOW_KEY:-}" ]; then
            npm run distribution:deploy -- --key "$INDEXNOW_KEY" --artifact-dir .build --allow-mixed
          else
            INDEXNOW_DRY_RUN=1 npm run distribution:deploy -- --artifact-dir .build --allow-mixed
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprylabs-hpc-distribution-reports
          path: |
            .build
            reports/indexnow-submit-report.json
