name: Deploy Distribution
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Validated commit SHA; leave blank to validate main in this run"
        required: false
        type: string
permissions:
  contents: read
  actions: read
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  deploy-distribution:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_ENDPOINT: https://api.indexnow.org/indexnow
      VALIDATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATED_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download exact validated distribution artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: sprylabs-hpc-validated-${{ github.event.workflow_run.head_sha }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate manual-dispatch source and build artifact
        if: github.event_name == 'workflow_dispatch'
        run: npm run release:ci-validate
        env:
          VALIDATED_COMMIT_SHA: ${{ env.VALIDATED_SHA }}
      - name: Verify validation attestation and artifact hashes
        run: npm run release:verify-attestation -- .build/validation-attestation.json "$VALIDATED_SHA"
      - name: Submit IndexNow or write dry-run report
        run: |
          if [ -n "${INDEXNOW_KEY:-}" ]; then
            npm run distribution:deploy -- --key "$INDEXNOW_KEY" --artifact-dir .build --allow-mixed
          else
            INDEXNOW_DRY_RUN=1 npm run distribution:deploy -- --artifact-dir .build --allow-mixed
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sprylabs-hpc-distribution-reports-${{ env.VALIDATED_SHA }}
          path: |
            reports/indexnow-submit-report.json
            .build/validation-attestation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
