name: Deploy Distribution

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Validated artifact name from Validate Repo"
        required: true
        type: string
      artifact_run_id:
        description: "Validate Repo workflow run ID containing the artifact"
        required: true
        type: string
      commit_sha:
        description: "Validated commit SHA"
        required: true
        type: string
  workflow_run:
    workflows: ["Validate Repo"]
    types:
      - completed
    branches:
      - main

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-distribution
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve validated artifact identity
        id: artifact
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ inputs.artifact_run_id }}" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=spry-validated-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Normalize downloaded validation artifact
        run: |
          mkdir -p .build
          if [ -d artifacts/distribution ]; then
            cp -n artifacts/distribution/* .build/
          fi
          if [ ! -f .build/validation-attestation.json ] && [ -f reports/validation-attestation.json ]; then
            cp reports/validation-attestation.json .build/validation-attestation.json
          fi
          test -f .build/validation-attestation.json
          test -f .build/indexnow-priority.txt
          test -f .build/indexnow-batch.txt
      - name: Verify attestation and deploy distribution
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.artifact.outputs.commit_sha }}
        run: |
          npm run release:verify-attestation
          npm run distribution:deploy
