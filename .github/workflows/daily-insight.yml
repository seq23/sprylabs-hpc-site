name: daily insight

on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: node scripts/release_one_draft.js
      - run: node scripts/build_insights.js
      - run: npm run velocity:sync
      - run: npm run distribution:prepare
      - run: npm run validate:all
      - run: npm run validate:critical
      - run: npm run validate:warnings

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "chore: release daily insight"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
