name: Daily Insight

on:
  workflow_dispatch:
  schedule:
    - cron: '20 14 * * *'

env:
  NODE_OPTIONS: --max-old-space-size=3072
  PUSH_RETRY_ATTEMPTS: 5
  REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
  REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before install
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npm run workflow:run -- --workflow daily-insight -- npm run programmatic:run-lane -- --lane daily_insight -- npm run workflow:daily-insight
      - run: |
          ./.github/scripts/commit_and_push_if_changed.sh "chore: release daily insight" daily-insight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-insight-trace
          path: reports/workflows/daily-insight/
