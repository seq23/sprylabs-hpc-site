name: Daily Insight
on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run governed daily insight release
        run: npm run workflow:run -- --workflow daily-insight -- npm run programmatic:run-lane -- --lane daily_insight -- npm run workflow:daily-insight
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-trace-daily-insight-${{ github.run_number }}
          path: reports/workflows/daily-insight/
          if-no-files-found: error
          retention-days: 30
      - name: Commit and push if changed
        env:
          GIT_RESTORE_TARGETS: '.build coverage reports'
        run: './.github/scripts/commit_and_push_if_changed.sh "chore: release daily insight"'
