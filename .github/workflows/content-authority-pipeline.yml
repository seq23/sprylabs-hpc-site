name: Content Authority Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  build-authority-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run programmatic:run-lane -- --lane authority -- npm run workflow:content-authority
      - name: Commit generated authority updates
        env:
          GIT_RESTORE_TARGETS: ".build coverage reports"
        run: './.github/scripts/commit_and_push_if_changed.sh "Run content authority pipeline"'
