name: Content Authority Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
  push:
    branches:
      - main
    paths:
      - 'data/report_fixes/agent_runs/**/agent_run_manifest.json'

env:
  NODE_OPTIONS: --max-old-space-size=3072
  REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
  REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npm run workflow:run -- --workflow content-authority -- npm run programmatic:run-lane -- --lane authority -- npm run workflow:content-authority
      - run: |
          ./.github/scripts/commit_and_push_if_changed.sh "Run content authority pipeline" content-authority
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-authority-trace
          path: reports/workflows/content-authority/
