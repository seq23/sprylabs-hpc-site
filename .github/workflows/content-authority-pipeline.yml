name: Content Authority Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"

permissions:
  contents: write

concurrency:
  group: content-authority-pipeline
  cancel-in-progress: true

jobs:
  build-authority-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Run content authority pipeline
        run: npm run content:pipeline
      - name: Validate
        run: npm run validate:all
      - name: Commit generated authority updates
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Run content authority pipeline"
            git pull --rebase origin main || true
            git push
          else
            echo "No authority updates to commit."
          fi
