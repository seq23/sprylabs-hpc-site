name: Admin Operations
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Registered admin operation"
        required: true
        type: choice
        options:
          - refresh_surfaces
          - submit_updated_pages
          - run_self_healing
          - fix_failed_pages
          - rerun_distribution
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
  PUSH_RETRY_ATTEMPTS: 5
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Sync latest main before install
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - name: Refresh authority surfaces
        if: inputs.operation == 'refresh_surfaces'
        run: npm run distribution:prepare && npm run ownership:build && npm run admin:build
      - name: Submit updated pages
        if: inputs.operation == 'submit_updated_pages'
        run: npm run distribution:prepare && npm run distribution:indexnow
      - name: Run self-healing
        if: inputs.operation == 'run_self_healing'
        run: npm run self-heal:generated-content && npm run citation:self-heal && npm run validate:full-safe-autonomy && npm run admin:build
      - name: Fix eligible failed pages
        if: inputs.operation == 'fix_failed_pages'
        run: npm run self-heal:generated-content && npm run citation:self-heal && npm run validate:ownership && npm run safe-harbor:validate && npm run release:content-finalize && npm run admin:build
      - name: Rerun distribution
        if: inputs.operation == 'rerun_distribution'
        run: npm run distribution:prepare && npm run distribution:deploy
      - name: Resolve replay command for repository-mutating admin operation
        if: inputs.operation != 'submit_updated_pages' && inputs.operation != 'rerun_distribution'
        run: |
          case "${{ inputs.operation }}" in
            refresh_surfaces)
              echo 'WORKFLOW_ARGV=npm run distribution:prepare && npm run ownership:build && npm run admin:build' >> "$GITHUB_ENV"
              ;;
            run_self_healing)
              echo 'WORKFLOW_ARGV=npm run self-heal:generated-content && npm run citation:self-heal && npm run validate:full-safe-autonomy && npm run admin:build' >> "$GITHUB_ENV"
              ;;
            fix_failed_pages)
              echo 'WORKFLOW_ARGV=npm run self-heal:generated-content && npm run citation:self-heal && npm run validate:ownership && npm run safe-harbor:validate && npm run release:content-finalize && npm run admin:build' >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported repository-mutating admin operation: ${{ inputs.operation }}" >&2
              exit 2
              ;;
          esac
      - name: Commit validated repository changes
        if: inputs.operation != 'submit_updated_pages' && inputs.operation != 'rerun_distribution'
        run: |
          ./.github/scripts/commit_and_push_if_changed.sh "admin operation: ${{ inputs.operation }}" admin-operations
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admin-operation-${{ inputs.operation }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/**
            artifacts/validation/**
            data/admin/**
            data/health/**
            data/metrics/**
