name: whitepaper release

on:
  schedule:
    - cron: '15 15 1 6,12 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  release-whitepaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run whitepaper:semiannual
      - run: npm run velocity:sync
      - run: npm run distribution:prepare
      - run: npm run validate:all
      - run: npm run validate:critical
      - run: npm run validate:warnings
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git add -A
          git commit -m "chore: release scheduled white paper" || echo "No changes to commit"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
