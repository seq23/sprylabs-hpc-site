name: Whitepaper Release
on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 1 6,12 *'
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  release-whitepaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run governed whitepaper release
        run: npm run workflow:run -- --workflow whitepaper-release -- npm run programmatic:run-lane -- --lane whitepaper -- npm run workflow:whitepaper
      - name: Commit and push if changed
        env:
          GIT_RESTORE_TARGETS: '.build coverage reports'
        run: './.github/scripts/commit_and_push_if_changed.sh "chore: release scheduled white paper" whitepaper-release'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-trace-whitepaper-release-${{ github.run_number }}
          path: reports/workflows/whitepaper-release/
          if-no-files-found: error
          retention-days: 30
