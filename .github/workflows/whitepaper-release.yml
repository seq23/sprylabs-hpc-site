name: Whitepaper Release

on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 1 6,12 *'

env:
  NODE_OPTIONS: --max-old-space-size=3072
  REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
  REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npm run workflow:run -- --workflow whitepaper-release -- npm run programmatic:run-lane -- --lane whitepaper -- npm run workflow:whitepaper
      - run: |
          ./.github/scripts/commit_and_push_if_changed.sh "chore: release scheduled white paper" whitepaper-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whitepaper-release-trace
          path: reports/workflows/whitepaper-release/
