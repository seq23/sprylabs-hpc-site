name: Social Signal Processing
on:
  schedule:
    - cron: '45 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run social:collect
      - run: npm run release:prepush:container
      - run: npm run validate:warnings
      - name: Commit and push if changed
        run: './.github/scripts/commit_and_push_if_changed.sh "chore: social signal refresh"'
