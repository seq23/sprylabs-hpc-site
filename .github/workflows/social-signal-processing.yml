name: Social Signal Processing

on:
  workflow_dispatch:
  schedule:
    - cron: '45 13 * * 1-5'
  push:
    paths:
      - 'data/report_fixes/agent_runs/**/agent_run_manifest.json'

env:
  NODE_OPTIONS: --max-old-space-size=3072
  REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
  REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run workflow:run -- --workflow social-signal -- npm run programmatic:run-lane -- --lane daily_insight -- npm run workflow:social-signal
      - run: ./.github/scripts/commit_and_push_if_changed.sh "chore: social signal refresh" social-signal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-signal-trace
          path: reports/workflows/social-signal/
