name: Social Signal Processing
on:
  workflow_dispatch:
  schedule:
    - cron: '45 13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run governed social signal processing
        run: npm run workflow:run -- --workflow social-signal -- npm run programmatic:run-lane -- --lane daily_insight -- npm run workflow:social-signal
      - name: Commit and push if changed
        env:
          GIT_RESTORE_TARGETS: '.build coverage reports'
        run: './.github/scripts/commit_and_push_if_changed.sh "chore: social signal refresh" social-signal'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-trace-social-signal-${{ github.run_number }}
          path: reports/workflows/social-signal/
          if-no-files-found: error
          retention-days: 30
