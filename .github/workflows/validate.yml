name: Validate

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npm run release:ci-validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-distribution
          include-hidden-files: true
          path: |
            .build/**
            reports/validation-attestation.json
