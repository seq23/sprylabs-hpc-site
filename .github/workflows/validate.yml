name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:ci-validate
      - uses: actions/upload-artifact@v7
        with:
          name: sprylabs-hpc-validated-${{ github.sha }}
          path: |
            .build
            reports/validation-attestation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
