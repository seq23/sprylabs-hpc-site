name: Entity Backlink Watch

# Authority audit, 30 Oct 2026: nothing checked that the sameAs profiles the
# Spry Labs entity claims still resolve and link back, so drift was invisible.
#
# Weekly, scripts/entity/entity_backlink_watch.mjs fetches every sameAs and
# pending profile in config/entity.json and every member side business:
#   - a dead profile (404/410/no DNS, twice) is removed from sameAs and a
#     pending profile that now resolves is promoted - but in this repo that
#     changes the Organization node on every page, and the extraction-surface
#     baseline may only be re-baselined after review (no workflow may
#     re-baseline it). So the run stops RED with "SELF-HEAL
#     READY", the exact sameAs change in the job summary and the report, and the
#     three commands that apply it; nothing half-applied reaches main.
#   - a profile that does not link back, a profile the owner has not created
#     yet and a member that does not yet point parentOrganization at Spry Labs
#     are NAMED STOPS in the job summary and reports/entity/backlink_watch.json,
#     which lands on main each week as the watch's evidence. They keep the run
#     green: they are owner or sibling-repo actions, not a broken watch.
#
# It writes main, so it is serialized with every other writer on
# main-automation and pushes only through commit_and_push_if_changed.sh
# (.github/scripts/test_commit_and_push_if_changed.sh enforces both).

on:
  schedule:
    # Wednesdays 14:17 UTC, off the hour and away from the Monday report.
    - cron: "17 14 * * 3"
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=3072
  GITHUB_TOKEN: ${{ github.token }}

permissions:
  contents: write
  # Lets the shared push helper request Validate Repo for the commit it lands.
  actions: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove the self-heal rules before trusting them
        run: npm run self-test:entity-backlink-watch
      - name: Check every profile and member
        shell: bash
        run: npm run watch:entity-backlinks -- --apply | tee watch.log
      - name: Named stops to the job summary
        if: always()
        run: |
          {
            echo "## Entity backlink watch"
            grep -E 'NAMED STOP|REMOVED|PROMOTED|\{"examined"' watch.log | sed 's/^\[entity-watch\] /- /' || echo "- nothing to report"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: A sameAs change stops here for one reviewed rebaseline
        run: |
          if git diff --quiet -- config/entity.json; then
            echo "sameAs unchanged"; exit 0
          fi
          {
            echo "## SELF-HEAL READY"
            echo '```diff'; git diff -- config/entity.json; echo '```'
            echo "Apply on a branch: \`npm run watch:entity-backlinks -- --apply\`, \`npm run repair:organization-node\`, then rebuild and re-baseline the extraction surfaces after review, and land the PR."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SELF-HEAL READY: config/entity.json sameAs changed; see the job summary"
          exit 1
      - name: Land the weekly evidence on main
        env:
          WORKFLOW_ARGV: "npm run watch:entity-backlinks"
        run: |
          ./.github/scripts/commit_and_push_if_changed.sh "entity backlink watch - weekly evidence" entity-backlink-watch
