name: Entity Backlink Watch

# Authority audit, 30 Oct 2026: nothing checked that the sameAs profiles the
# Spry Labs entity claims still resolve and link back, so drift was invisible.
#
# Weekly, scripts/entity/entity_backlink_watch.mjs fetches every sameAs and
# pending profile in config/entity.json and every member side business:
#   - a dead profile (404/410/no DNS, twice) is removed from sameAs,
#   - a pending profile that now resolves is promoted into sameAs,
#   and either change is applied to every page (the organization-node repair,
#   then the ordered build with the extraction-surface snapshot re-baselined for
#   that one config change) and lands on main through the shared push helper,
#   which requests Validate Repo for the exact commit it pushed;
#   - a profile that does not link back, a profile the owner has not created
#     yet and a member that does not yet point parentOrganization at Spry Labs
#     are NAMED STOPS in the job summary and reports/entity/backlink_watch.json,
#     which is committed each week as the watch's evidence.
# Named stops keep the run green: they are owner or sibling-repo actions, not a
# broken watch. The run is red only when the watch itself fails (Rule 0: it
# examined nothing) or the self-heal could not be built and landed.
#
# It writes main, so it is serialized with every other writer on
# main-automation and pushes only through commit_and_push_if_changed.sh
# (.github/scripts/test_commit_and_push_if_changed.sh enforces both).

on:
  schedule:
    # Wednesdays 14:17 UTC, off the hour and away from the Monday report.
    - cron: "17 14 * * 3"
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=3072
  GITHUB_TOKEN: ${{ github.token }}

permissions:
  contents: write
  # Lets the shared push helper request Validate Repo for the commit it lands.
  actions: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove the self-heal rules before trusting them
        run: npm run self-test:entity-backlink-watch
      - name: Check every profile and member
        shell: bash
        run: npm run watch:entity-backlinks -- --apply | tee watch.log
      - name: Named stops to the job summary
        if: always()
        run: |
          {
            echo "## Entity backlink watch"
            grep -E 'NAMED STOP|REMOVED|PROMOTED|\{"examined"' watch.log | sed 's/^\[entity-watch\] /- /' || echo "- nothing to report"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply a sameAs self-heal to every page
        run: |
          if git diff --quiet -- config/entity.json; then
            echo "sameAs unchanged; nothing to rebuild"; exit 0
          fi
          npm run repair:organization-node
          EXTRACTION_SURFACE_REBASELINE=1 node .github/scripts/validation_shards.mjs producers
      - name: Land the evidence (and any self-heal) on main
        env:
          WORKFLOW_ARGV: "npm run watch:entity-backlinks -- --apply && npm run repair:organization-node"
        run: |
          ./.github/scripts/commit_and_push_if_changed.sh "entity backlink watch - weekly evidence and sameAs self-heal" entity-backlink-watch
