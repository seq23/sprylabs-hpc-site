name: Citation Probe

# The probe existed in seven repos and was invoked by no workflow in any of
# them, so no citation observation was ever taken on a schedule. Weekly is
# enough to read a trend without spending much: grounded mode bills per search,
# one model, so a run is cents.

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "grounded reads real retrieval; knowledge only shows whether the model memorised us"
        required: true
        type: choice
        options: [grounded, knowledge]
        default: grounded
      limit:
        description: "Maximum queries this run"
        required: true
        type: string
        default: "25"

permissions:
  contents: write

concurrency:
  group: citation-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Observe whether answer engines cite us
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: ${{ github.event.inputs.mode || 'grounded' }}
        run: node scripts/llm_citation_probe.mjs --limit "${{ github.event.inputs.limit || '25' }}"
      - name: Record the observation
        run: |
          if git diff --quiet -- data/signals/llm_citation_observations.json; then
            echo "no change to record"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals/llm_citation_observations.json
          git commit -m "Record citation probe observations $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: citation-observations-${{ github.run_id }}
          if-no-files-found: warn
          path: data/signals/llm_citation_observations.json
