name: Validate Repo
# The merge gate, lean shape (7 Nov 2026): syntax check, behaviour unit tests,
# and ONE validator runner holding only the safety checks
# (scripts/validators/run_safety_checks.mjs). Budget: under 5 minutes.
# The page engine is Search Loop (search-loop.yml); the in-repo content engine,
# its producer/shard pipeline and its page-format validators were retired.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax check every script
        run: npm run typecheck
      - name: Behaviour unit tests
        run: npm test
      - name: Safety checks
        run: npm run validate
