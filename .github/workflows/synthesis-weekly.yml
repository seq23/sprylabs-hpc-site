name: Weekly Synthesis Builder
on:
  workflow_dispatch:
  schedule:
    - cron: "45 14 * * 1"
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run clusters:update
      - run: npm run synthesis:build
      - name: Build admin page
        env:
          SPRY_ADMIN_PASSWORD: ${{ secrets.SPRY_ADMIN_PASSWORD || 'aplayer' }}
        run: npm run admin:build
      - run: npm run release:prepush:container
      - run: npm run validate:warnings
      - name: Commit synthesis updates
        env:
          GIT_RESTORE_TARGETS: ".build coverage reports"
        run: './.github/scripts/commit_and_push_if_changed.sh "Build weekly synthesis layer"'
