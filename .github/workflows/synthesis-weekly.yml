name: Weekly Synthesis Builder
on:
  workflow_dispatch:
  schedule:
    - cron: "45 14 * * 1"
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run programmatic:run-lane -- --lane synthesis -- npm run workflow:synthesis-weekly
      - name: Commit synthesis updates
        env:
          GIT_RESTORE_TARGETS: ".build coverage reports"
        run: './.github/scripts/commit_and_push_if_changed.sh "Build weekly synthesis layer"'
