name: Weekly Synthesis Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "45 14 * * 1"

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Update content clusters
        run: npm run clusters:update
      - name: Build synthesis articles
        run: npm run synthesis:build
      - name: Sync velocity layer
        run: npm run velocity:sync
      - name: Build admin page
        env:
          SPRY_ADMIN_PASSWORD: ${{ secrets.SPRY_ADMIN_PASSWORD || 'aplayer' }}
        run: npm run admin:build
      - name: Validate
        run: npm run guardrails:all
      - name: Validate velocity critical surface
        run: npm run validate:critical
      - name: Report velocity warnings
        run: npm run validate:warnings
      - name: Commit synthesis updates
        env:
          GIT_RESTORE_TARGETS: ".build coverage reports"
        run: './.github/scripts/commit_and_push_if_changed.sh "Build weekly synthesis layer"'
