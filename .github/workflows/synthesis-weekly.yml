name: Weekly Synthesis Builder
on:
  workflow_dispatch:
  schedule:
    - cron: '45 14 * * 1'
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run governed weekly synthesis
        run: npm run workflow:run -- --workflow synthesis-weekly -- npm run programmatic:run-lane -- --lane synthesis -- npm run workflow:synthesis-weekly
      - name: Commit synthesis updates
        env:
          GIT_RESTORE_TARGETS: '.build coverage reports'
        run: './.github/scripts/commit_and_push_if_changed.sh "Build weekly synthesis layer" synthesis-weekly'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-trace-synthesis-weekly-${{ github.run_number }}
          path: reports/workflows/synthesis-weekly/
          if-no-files-found: error
          retention-days: 30
