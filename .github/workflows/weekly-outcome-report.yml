name: Weekly Outcome Report

# Search Readiness item i9.
#
# "Without a report nobody notices a drop for a month. Without self-closing
# issues the list rots."
#
# Wednesday 07:33 America/Chicago (owner's rebalanced week, 1 Nov 2026; a DST
# pair of UTC crons and a guard that lets only the matching one run), week over
# week per site, from the measurements the
# search-intelligence lane already collects - gsc_truth.json and each host's
# index_coverage.json. It invents no numbers: the first recorded week says it has
# no prior week rather than showing a delta against nothing.
#
# It reads and reports. The only thing it writes back is the week's own history
# row and the two report files, so a report run can never move a page, a script
# or a validator.
#
# Nothing here waits on a human, and NOTHING HERE EMAILS (1 Nov 2026): the
# summary goes up as the artifact `spry-weekly-summary` and Boss OS sends the
# one "Spry Labs weekly" email at 08:15 Central, a short section per business. One self-closing issue per red
# site is what keeps the list from rotting: red opens it, still red comments,
# no longer red closes it with the measurement that cleared it.

on:
  schedule:
    # Mondays 13:41 UTC: after the daily search-intelligence cycle (23 13) has
    # landed the week's last measurements, and offset off the hour so it does not
    # queue behind every other cron in the account.
    - cron: "33 12 * * 3"
    - cron: "33 13 * * 3"
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=3072

permissions:
  # The issues scope is the point: one self-closing issue per red site.
  contents: read
  issues: write

concurrency:
  group: weekly-outcome-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Guard Wednesday 07:33 Chicago
        id: guard
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Chicago date +%z)
          run=true
          if [ "$SCHEDULE" = "33 12 * * 3" ] && [ "$offset" != "-0500" ]; then run=false; fi
          if [ "$SCHEDULE" = "33 13 * * 3" ] && [ "$offset" != "-0600" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "schedule='${SCHEDULE:-dispatch}' chicago_offset=$offset run=$run"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
        with:
          # The week-over-week comparison reads the collector's own committed
          # snapshot from at least seven days back. A shallow clone reaches no
          # such commit and every delta would silently be absent.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.guard.outputs.run == 'true'
      - name: Prove the report's rules before trusting its numbers
        if: steps.guard.outputs.run == 'true'
        run: |
          npm run self-test:weekly-outcome-report
          node .github/scripts/spry_weekly_summary.mjs --self-check
      - name: Build the weekly outcome report
        if: steps.guard.outputs.run == 'true'
        run: npm run report:weekly-outcome
      - name: Reconcile one self-closing issue per red site
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/weekly_outcome_notify.mjs
      - name: Hand the week to Boss OS (the Spry Labs weekly email)
        if: steps.guard.outputs.run == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/spry_weekly_summary.mjs reports/weekly_outcome_report.json spry-weekly-summary.json
      - name: Upload the summary for Boss OS
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spry-weekly-summary
          path: spry-weekly-summary.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.run == 'true'
        with:
          name: weekly-outcome-report
          path: |
            reports/weekly_outcome_report.json
            reports/weekly_outcome_report.md
