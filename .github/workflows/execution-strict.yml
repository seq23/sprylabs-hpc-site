name: Execution Strict
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run governed strict execution
        run: npm run workflow:run -- --workflow execution-strict -- npm run programmatic:run-lane -- --lane authority -- npm run workflow:execution-strict
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-trace-execution-strict-${{ github.run_number }}
          path: reports/workflows/execution-strict/
          if-no-files-found: error
          retention-days: 30
      - name: Commit execution outputs if changed
        env:
          GIT_RESTORE_TARGETS: '.build coverage reports'
        run: './.github/scripts/commit_and_push_if_changed.sh "auto: strict execution refresh"'
