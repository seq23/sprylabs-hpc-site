name: Execution Strict

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  execution:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run execution:strict

      - name: Commit execution outputs if changed
        env:
          GIT_RESTORE_TARGETS: ".build coverage reports"
        run: './.github/scripts/commit_and_push_if_changed.sh "auto: strict execution refresh"'
